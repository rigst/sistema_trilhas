name: CI

# O pipeline vive em github.com/rigst/ci. Ajuste lá vale para todos os projetos.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: rigst/ci/.github/workflows/python-django.yml@v1
    secrets: inherit
    with:
      python-version: "3.12"
      django-settings-module: config.settings.production
      source-paths: "accounts ai avaliacoes chat config legal trilhas"

      # Os testes rodam em development (SQLite, Celery eager), como já era com
      # `manage.py test`. Em production o SECURE_SSL_REDIRECT faria todo request
      # do test client virar 301.
      test-settings-module: config.settings.development
      postgres: false

      # Valores fictícios, só para os settings de produção carregarem no CI.
      # Nenhum segredo real entra aqui — os de verdade ficam em Secrets.
      django-env: |
        SECRET_KEY=ci-only-0a1B2c3D4e5F6g7H8i9J-kLmNoPqRsTuVwXyZ-abcdefghij
        ALLOWED_HOSTS=example.com
        DEBUG=False
        DB_NAME=postgres
        DB_USER=postgres
        DB_PASSWORD=postgres
        DB_HOST=localhost
        DB_PORT=5432
        REDIS_URL=redis://localhost:6379/3
        CACHE_REDIS_URL=redis://localhost:6379/4
        SESSION_REDIS_URL=redis://localhost:6379/5
        CELERY_BROKER_URL=redis://localhost:6379/3
        CELERY_RESULT_BACKEND=redis://localhost:6379/3
        ANTHROPIC_API_KEY=ci-only-nao-e-uma-chave-real
        SITE_URL=https://example.com

      # Nada em soft-fail: toda etapa bloqueia.
      #
      # O bandit saiu porque o portão passou a ser por severidade: zero achados
      # altos, e os médios que restam foram auditados (mark_safe sobre HTML já
      # sanitizado com allowlist do nh3). O pip-audit saiu porque não há CVE
      # aberta — se aparecer uma, é para travar mesmo; se virar bloqueio
      # recorrente por CVE de dependência transitiva, devolva à lista.
      #
      # O mypy foi o último, depois que o plugin do django-stubs entrou no
      # pipeline compartilhado (324 erros viraram 35) e os 35 foram resolvidos.
      soft-fail: ""

      run-sonar: true
      sonar-project-key: rigst_sistema_trilhas
      sonar-organization: rigst

      # O cadastro por e-mail responde 404 enquanto SIGNUP_ENABLED for False, e
      # é uma das telas públicas que a auditoria precisa ver. Os testes que
      # dependem do valor usam override_settings, inclusive o do caso False,
      # então ligar aqui não muda o veredito da suíte.
      test-env: |
        SIGNUP_ENABLED=True

      # Inventário de licenças + SBOM: nada a configurar, o projeto passa na
      # política padrão (AGPL-3.0 aceita permissivas e copyleft da família).
      run-licencas: true
      run-sbom: true

      # Lock com hashes: confere requirements.lock contra o requirements.txt
      # (que agora traz pin exato) e instala com --require-hashes. Resolvido
      # para 3.12, a mesma versão que o servidor roda.
      run-lock: true

      # Ponta a ponta: trilhas/tests_e2e.py, sob o marcador `e2e`, que o
      # pytest.ini tira da suíte padrão. O playwright já é dependência de
      # runtime (renderiza os slides do vídeo).
      run-e2e: true

      # Acessibilidade: só as telas que existem sem sessão — o axe roda
      # deslogado. Vale o padrão `serious` como limite de reprovação: as cinco
      # páginas passam limpas hoje, então não há dívida para tolerar.
      run-a11y: true
      a11y-paths: |
        /login/
        /accounts/cadastro/
        /termos/
        /privacidade/
        /offline/
