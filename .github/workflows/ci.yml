name: CI

# O pipeline vive em github.com/rigst/ci. Ajuste lá vale para todos os projetos.

on:
  push:
    branches: [main]
  pull_request:
  # Botão de reprovocação. Em 02/09/2026 um merge na main do sistema_vetorial
  # não gerou evento de push: zero check-runs no commit, logo nenhum CI e —
  # porque o CD pende de `workflow_run` — nenhum deploy. Um commit entrou na
  # main sem validação e o servidor ficou para trás, em silêncio. Sem isto a
  # única saída seria um commit vazio só para provocar o push de novo.
  # Serve também de redeploy manual quando o CD falha por motivo transitório.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    # SHA e não `@v1`: a tag é um ponteiro móvel, e quem a mover passa a
    # executar código arbitrário com os segredos deste repositório. O
    # dependabot abre PR revisável quando o pipeline compartilhado avança.
    uses: rigst/ci/.github/workflows/python-django.yml@182e57ed18875bee574ea562c8315476fc8b9bf9 # v1
    # Explícito em vez de `secrets: inherit`: o workflow chamado recebe só
    # estes dois, e não tudo que o repositório tiver hoje ou vier a ter.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      python-version: "3.12"
      django-settings-module: config.settings.production
      source-paths: "accounts ai avaliacoes chat config legal trilhas"

      # Os testes rodam em development (SQLite, Celery eager), como já era com
      # `manage.py test`. Em production o SECURE_SSL_REDIRECT faria todo request
      # do test client virar 301.
      test-settings-module: config.settings.development
      postgres: false

      # Valores fictícios, só para os settings de produção carregarem no CI.
      # Nenhum segredo real entra aqui — os de verdade ficam em Secrets.
      django-env: |
        SECRET_KEY=ci-only-0a1B2c3D4e5F6g7H8i9J-kLmNoPqRsTuVwXyZ-abcdefghij
        ALLOWED_HOSTS=example.com
        DEBUG=False
        DB_NAME=postgres
        DB_USER=postgres
        DB_PASSWORD=postgres
        DB_HOST=localhost
        DB_PORT=5432
        REDIS_URL=redis://localhost:6379/3
        CACHE_REDIS_URL=redis://localhost:6379/4
        SESSION_REDIS_URL=redis://localhost:6379/5
        CELERY_BROKER_URL=redis://localhost:6379/3
        CELERY_RESULT_BACKEND=redis://localhost:6379/3
        ANTHROPIC_API_KEY=ci-only-nao-e-uma-chave-real
        SITE_URL=https://example.com

      # Nada em soft-fail: toda etapa bloqueia.
      #
      # O bandit saiu porque o portão passou a ser por severidade: zero achados
      # altos, e os médios que restam foram auditados (mark_safe sobre HTML já
      # sanitizado com allowlist do nh3). O pip-audit saiu porque não há CVE
      # aberta — se aparecer uma, é para travar mesmo; se virar bloqueio
      # recorrente por CVE de dependência transitiva, devolva à lista.
      #
      # O mypy foi o último, depois que o plugin do django-stubs entrou no
      # pipeline compartilhado (324 erros viraram 35) e os 35 foram resolvidos.
      soft-fail: ""

      run-sonar: ${{ github.actor != 'dependabot[bot]' }}
      sonar-project-key: rigst_sistema_trilhas
      sonar-organization: rigst
      # `qualitygate.wait`: sem isto o job termina verde assim que envia a
      # análise, e o gate reprovando não apareceria no CI.
      #
      # `**/*.js` e `**/*.html`: não existe teste de JavaScript neste projeto e
      # nunca existiu, então contar essas linhas como 0% não informa nada — só
      # esconde a cobertura real do Python atrás de um número ruim. Mesmo
      # tratamento já dado ao sistema_vetorial.
      #
      # `**/celery.py`: o módulo é configuração de app, executado pelo worker e
      # não pela suíte.
      #
      # A lista repete a do pipeline compartilhado porque propriedade repetida
      # no scanner é substituída, não somada.
      # `issue.ignore.multicriteria`: o Web:S5247 ("autoescape desligado") tem
      # seis ocorrências legítimas, de dois tipos, e nenhuma é conteúdo de
      # usuário chegando cru na página.
      #
      # e1 e e3 — templates/legal/*.html e trilhas/salvos.html: o HTML vem de
      # `nh3.clean` com allowlist de tags, atributos e esquemas de URL, aplicado
      # na GRAVAÇÃO (legal/utils.py:renderizar_markdown e
      # trilhas/mdrender.py:_sanitizar). Tirar o `|safe` aqui não protegeria
      # nada — só mostraria a marcação como texto.
      #
      # e2 — templates/registration/*_email.html: são e-mails em texto puro,
      # não HTML. `{% autoescape off %}` ali existe para o corpo não sair com
      # `&#x27;` no lugar de aspas.
      #
      # As duas ocorrências que NÃO eram legítimas (o `|safe` no help_text dos
      # campos de senha) foram removidas no mesmo PR: o Django já entrega esse
      # texto marcado como seguro, e o render sai idêntico sem o filtro.
      #
      # e4 — javascript:S2245 em templates/base.html: são as duas chamadas de
      # `Math.random()` que espalham as faíscas da animação de conclusão, uma
      # sorteia a distância do estilhaço e a outra o atraso. Nada ali vira
      # token, senha, id ou ordem de sorteio; trocar por `crypto` só custaria
      # entropia cara para desenhar a mesma fagulha.
      sonar-args: >-
        -Dsonar.qualitygate.wait=true
        -Dsonar.issue.ignore.multicriteria=e1,e2,e3,e4
        -Dsonar.issue.ignore.multicriteria.e1.ruleKey=Web:S5247
        -Dsonar.issue.ignore.multicriteria.e1.resourceKey=**/templates/legal/*.html
        -Dsonar.issue.ignore.multicriteria.e2.ruleKey=Web:S5247
        -Dsonar.issue.ignore.multicriteria.e2.resourceKey=**/templates/registration/*_email.html
        -Dsonar.issue.ignore.multicriteria.e3.ruleKey=Web:S5247
        -Dsonar.issue.ignore.multicriteria.e3.resourceKey=**/templates/trilhas/salvos.html
        -Dsonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S2245
        -Dsonar.issue.ignore.multicriteria.e4.resourceKey=**/templates/base.html
        -Dsonar.coverage.exclusions=**/migrations/**,**/tests.py,**/tests_*.py,**/test_*.py,**/tests/**,**/conftest.py,**/settings/**,**/settings.py,**/manage.py,**/wsgi.py,**/asgi.py,**/celery.py,scripts/**,deploy/**,**/*.js,**/*.html

      # O cadastro por e-mail responde 404 enquanto SIGNUP_ENABLED for False, e
      # é uma das telas públicas que a auditoria precisa ver. Os testes que
      # dependem do valor usam override_settings, inclusive o do caso False,
      # então ligar aqui não muda o veredito da suíte.
      test-env: |
        SIGNUP_ENABLED=True

      # Inventário de licenças + SBOM: nada a configurar, o projeto passa na
      # política padrão (AGPL-3.0 aceita permissivas e copyleft da família).
      run-licencas: true
      run-sbom: true

      # Lock com hashes: confere requirements.lock contra o requirements.txt
      # (que agora traz pin exato) e instala com --require-hashes. Resolvido
      # para 3.12, a mesma versão que o servidor roda.
      run-lock: true

      # Ponta a ponta: trilhas/tests_e2e.py, sob o marcador `e2e`, que o
      # pytest.ini tira da suíte padrão. O playwright já é dependência de
      # runtime (renderiza os slides do vídeo).
      run-e2e: true

      # Acessibilidade: só as telas que existem sem sessão — o axe roda
      # deslogado. Vale o padrão `serious` como limite de reprovação: as cinco
      # páginas passam limpas hoje, então não há dívida para tolerar.
      run-a11y: true
      a11y-paths: |
        /login/
        /accounts/cadastro/
        /termos/
        /privacidade/
        /offline/
