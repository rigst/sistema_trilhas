name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrações em dia (sem migração faltando)
        run: python manage.py makemigrations --check --dry-run

      - name: Testes
        run: python manage.py test --noinput

      - name: check --deploy (settings de produção)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          # Chave longa e variada só para o check --deploy não emitir W009 no CI.
          SECRET_KEY: ci-only-0a1B2c3D4e5F6g7H8i9J-kLmNoPqRsTuVwXyZ-abcdefghij
          ALLOWED_HOSTS: example.com
          DEBUG: "False"
          DB_NAME: trilhas
          DB_USER: trilhas
          DB_PASSWORD: x
          DB_HOST: localhost
          DB_PORT: "5432"
        run: python manage.py check --deploy --fail-level WARNING

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: pip-audit (vulnerabilidades nas dependências)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r requirements.txt
          pip-audit
