# Exemplo de server block Nginx para o Trilhas de Estudo.
# Ajuste server_name e caminhos de certificado.

server {
    listen 80;
    server_name trilhas.exemplo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trilhas.exemplo.com;

    # ssl_certificate     /etc/letsencrypt/live/trilhas.exemplo.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/trilhas.exemplo.com/privkey.pem;

    client_max_body_size 10M;

    location /static/ {
        alias /var/www/sistema_trilhas/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/var/www/sistema_trilhas/trilhas.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
