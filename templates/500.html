<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algo deu errado · Trilhas de Estudo</title>
  <style>
    :root { color-scheme: dark light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0C1020; color: #e8ecf6; padding: 1.5rem;
    }
    .box {
      max-width: 30rem; text-align: center; background: #141a30;
      border: 1px solid #23304f; border-radius: 18px; padding: 2.2rem 1.8rem;
    }
    h1 { font-size: 2.4rem; margin: .2rem 0 .6rem; }
    p { color: #9fb0d0; line-height: 1.5; }
    a {
      display: inline-block; margin-top: 1.3rem; padding: .7rem 1.4rem;
      border-radius: 12px; background: #1fb6a6; color: #062820;
      font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Ops!</h1>
    <p>Algo deu errado do nosso lado. Já registramos o problema — tente novamente em instantes.</p>
    <a href="/">Voltar ao início</a>
  </div>
</body>
</html>
