{# Sprite de ícones inline (traço, currentColor). Use: <svg class="ic" aria-hidden="true"><use href="#ic-nome"/></svg> #}
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    {# Metais dos troféus (um gradiente por patamar). #}
    <linearGradient id="mg-bronze" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#f4c088"/><stop offset=".5" stop-color="#c9812f"/><stop offset="1" stop-color="#82501c"/>
    </linearGradient>
    <linearGradient id="mg-prata" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c6cedb"/><stop offset="1" stop-color="#828d9c"/>
    </linearGradient>
    <linearGradient id="mg-ouro" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#fff3c8"/><stop offset=".5" stop-color="#eeb838"/><stop offset="1" stop-color="#a9781a"/>
    </linearGradient>
    <linearGradient id="mg-platina" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#dde7f0"/><stop offset="1" stop-color="#95a8bb"/>
    </linearGradient>
    <linearGradient id="mg-diamante" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#a6f2f8"/><stop offset="1" stop-color="#3cb0d2"/>
    </linearGradient>
  </defs>
  {# Marca do app: trilha pontilhada subindo até a estrela. Herda currentColor. #}
  <symbol id="logo-trilhas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
    <path stroke-dasharray=".1 3.3" d="M5 19.4C10.6 19.1 9.4 11.6 15.2 9.6"/>
    <circle cx="5" cy="19.4" r="1.8" fill="currentColor" stroke="none"/>
    <path fill="currentColor" stroke="none" d="M17.7 3.4l1.2 2.9 2.9 1.2-2.9 1.2-1.2 2.9-1.2-2.9-2.9-1.2 2.9-1.2z"/>
  </symbol>
  {# Troféu: alças herdam stroke, taça/pedestal herdam fill do <svg> (.medal--*). #}
  <symbol id="ic-trophy" viewBox="0 0 64 64">
    <!-- alças -->
    <path fill="none" stroke-width="3.6" stroke-linecap="round"
          d="M14.5 12.5H9.2A4.2 4.2 0 0 0 5 16.7c0 8.6 5.6 14.9 13.4 16.6M49.5 12.5h5.3A4.2 4.2 0 0 1 59 16.7c0 8.6-5.6 14.9-13.4 16.6"/>
    <!-- taça -->
    <path stroke="none" d="M15 5.5h34c.8 0 1.5.7 1.5 1.5v13.6c0 10.9-7.4 18.9-18.5 18.9S13.5 31.5 13.5 20.6V7c0-.8.7-1.5 1.5-1.5z"/>
    <!-- lábio (sombra interna do bocal) -->
    <path stroke="none" fill="rgba(0,0,0,.16)" d="M13.5 8.6h37v2.8h-37z"/>
    <!-- brilho lateral -->
    <path stroke="none" fill="rgba(255,255,255,.3)"
          d="M18.5 13.5c0-.6.4-1 1-1h3.6c.6 0 1 .4 1 1v7.9c0 4.5 1 8.3 2.9 11.2-5.4-2.3-8.5-7-8.5-13.5z"/>
    <!-- haste e nó -->
    <path stroke="none" d="M29 39.3h6l1.2 6.2h-8.4z"/>
    <ellipse stroke="none" cx="32" cy="47.7" rx="3.2" ry="2.3"/>
    <!-- base em dois patamares, com filete de luz -->
    <path stroke="none" d="M22.5 50.6h19a3 3 0 0 1 3 3v.9h-25v-.9a3 3 0 0 1 3-3z"/>
    <path stroke="none" d="M18 56h28a3 3 0 0 1 3 3v.9H15V59a3 3 0 0 1 3-3z"/>
    <path stroke="none" fill="rgba(255,255,255,.22)" d="M19.5 54.5h25v1.5h-25z"/>
  </symbol>
  <symbol id="ic-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.5 5v14M15.5 5v14"/>
  </symbol>
  <symbol id="ic-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 4.5v15l13-7.5z"/>
  </symbol>
  <symbol id="ic-compass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>
  </symbol>
  <symbol id="ic-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 11a8 8 0 0 0-14-4.5L4 8"/><path d="M4 4v4h4"/>
    <path d="M4 13a8 8 0 0 0 14 4.5L20 16"/><path d="M20 20v-4h-4"/>
  </symbol>
  <symbol id="ic-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 5v14M5 12h14"/>
  </symbol>
  <symbol id="ic-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l1.8 4.9L18.5 9.7 13.8 11.5 12 16.4 10.2 11.5 5.5 9.7 10.2 7.9z"/>
    <path d="M18.5 15.5l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7z"/>
  </symbol>
  <symbol id="ic-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 5a2 2 0 0 1 2-2h5v16H6a2 2 0 0 0-2 2z"/><path d="M20 5a2 2 0 0 0-2-2h-5v16h5a2 2 0 0 1 2 2z"/>
  </symbol>
  <symbol id="ic-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/>
  </symbol>
  <symbol id="ic-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
  </symbol>
  <symbol id="ic-cap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.1 2.7 2.5 6 2.5s6-1.4 6-2.5v-5"/>
  </symbol>
  <symbol id="ic-flame" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <path d="M13 2c.5 3-1.5 4.5-3 6.5C8.4 10.6 7 12.4 7 15a5 5 0 0 0 10 0c0-2-1-3.6-2-5 .2 1.2-.4 2.2-1.3 2.6.7-2.2-.3-4.8-2.7-5.6C12 4 13.3 3.3 13 2z"/>
  </symbol>
  {# Gema lapidada: base herda currentColor (tinge com o tema); facetas são só
     realces brancos e sombras pretas por cima, dando volume/brilho em qualquer cor. #}
  <symbol id="ic-diamante" viewBox="0 0 24 24" stroke="none">
    <path fill="currentColor" d="M7 3h10l3.5 5.2L12 21 3.5 8.2z"/>
    <path fill="#fff" fill-opacity=".30" d="M8.2 3h7.6L14 8.2H10z"/>
    <path fill="#fff" fill-opacity=".16" d="M7 3h1.2L10 8.2H3.5z"/>
    <path fill="#000" fill-opacity=".10" d="M15.8 3H17l3.5 5.2H14z"/>
    <path fill="#fff" fill-opacity=".07" d="M3.5 8.2H10L12 21z"/>
    <path fill="#000" fill-opacity=".16" d="M10 8.2h4L12 21z"/>
    <path fill="#000" fill-opacity=".26" d="M14 8.2h6.5L12 21z"/>
    <path fill="#fff" fill-opacity=".60" d="M9.1 3.5h2L10.3 7.6 9.6 7.6z"/>
    <path fill="none" stroke="#fff" stroke-width=".9" stroke-opacity=".55" stroke-linejoin="round" d="M3.5 8.2h17M8.2 3 10 8.2 12 21 14 8.2 15.8 3"/>
  </symbol>
  <symbol id="ic-medal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3l2 5M16 3l-2 5"/><circle cx="12" cy="15" r="5"/><path d="M12 13v4M10 15h4"/>
  </symbol>
  <symbol id="ic-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 10.5L12 4l8 6.5"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/>
  </symbol>
  <symbol id="ic-chev-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.5 5.5L8 12l6.5 6.5"/>
  </symbol>
  <symbol id="ic-chev-r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 5.5L16 12l-6.5 6.5"/>
  </symbol>
  <symbol id="ic-bookmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 3.5h10a1 1 0 0 1 1 1V20l-6-3.8L6 20V4.5a1 1 0 0 1 1-1z"/>
  </symbol>
  <symbol id="ic-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20l1.2-4.2L16.6 4.4a2 2 0 0 1 2.9 0l.1.1a2 2 0 0 1 0 2.9L8.2 18.8z"/><path d="M14.5 6.5l3 3"/>
  </symbol>
  <symbol id="ic-sword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4h3.5L18 14.5V18h-3.5L4 7.5z"/><path d="M14 18l-2.5 2.5"/><path d="M18 14l2.5 2.5"/><path d="M16 21l5-5"/>
  </symbol>
  <symbol id="ic-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.5 6h12M8.5 12h12M8.5 18h12"/><path d="M3.8 6h.01M3.8 12h.01M3.8 18h.01"/>
  </symbol>
  <symbol id="ic-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/>
  </symbol>
  {# Marcas dos avisos (toasts) e o X que os dispensa. #}
  <symbol id="ic-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12.5l4.5 4.5L19 7"/>
  </symbol>
  <symbol id="ic-alerta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.8 2.9 19.6h18.2L12 3.8Z"/><path d="M12 9.4v4.1M12 16.8h.01"/>
  </symbol>
  <symbol id="ic-erro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 7.2v5.4M12 16.4h.01"/>
  </symbol>
  <symbol id="ic-fechar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 6l12 12M18 6 6 18"/>
  </symbol>
  <symbol id="ic-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.6-.7L3 21l1.9-5.1A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>
  </symbol>
  <symbol id="ic-enviar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 12 20 4l-3.2 16-4.4-6.2z"/><path d="m12.4 13.8-8.4-1.8"/>
  </symbol>
</svg>
